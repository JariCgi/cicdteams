name: Deploy Teams RSS Feed (Actions-only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Install xmlstarlet
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Restore RSS History
        uses: actions/cache/restore@v4
        with:
          path: public
          key: rss-storage-${{ github.ref_name }}
          restore-keys: |
            rss-storage-

      - name: Generate/Update RSS
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p public/feed
          PUB_DATE=$(date -R)
          FEED_FILE="public/feed/feed.xml"
          LIMIT=20
          
          STATUS="${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILURE' }}"
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | tr -d '\r')
          
          TITLE="$STATUS | $CLEAN_MSG"
          DESC="Tekijä: ${{ github.actor }} | ID: ${GITHUB_SHA:0:7}"

          if [ -f "$FEED_FILE" ]; then
            echo "Päivitetään olemassa olevaa tiedostoa..."
            xmlstarlet ed -L \
              -s "/rss/channel" -t elem -n "item" -v "" \
              -s "/rss/channel/item[last()]" -t elem -n "title" -v "$TITLE" \
              -s "/rss/channel/item[last()]" -t elem -n "link" -v "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -s "/rss/channel/item[last()]" -t elem -n "description" -v "$DESC" \
              -s "/rss/channel/item[last()]" -t elem -n "pubDate" -v "$PUB_DATE" \
              -s "/rss/channel/item[last()]" -t elem -n "guid" -v "${{ github.sha }}-$GITHUB_RUN_ID" \
              -m "/rss/channel/item[last()]" "/rss/channel/description" \
              -d "/rss/channel/item[position() > $LIMIT]" \
              -u "/rss/channel/lastBuildDate" -v "$PUB_DATE" \
              "$FEED_FILE"
          else
            echo "Luodaan uusi tiedosto puhtaalta pöydältä..."
            printf '<?xml version="1.0" encoding="UTF-8" ?>\n' > "$FEED_FILE"
            printf '<rss version="2.0">\n<channel>\n' >> "$FEED_FILE"
            printf '<title>Deployment Feed: %s</title>\n' "${{ github.event.repository.name }}" >> "$FEED_FILE"
            printf '<link>https://%s.github.io/%s/</link>\n' "${{ github.repository_owner }}" "${{ github.event.repository.name }}" >> "$FEED_FILE"
            printf '<description>CI/CD Status Feed</description>\n' >> "$FEED_FILE"
            printf '<lastBuildDate>%s</lastBuildDate>\n' "$PUB_DATE" >> "$FEED_FILE"
            printf '<item>\n<title>%s</title>\n' "$TITLE" >> "$FEED_FILE"
            printf '<link>https://github.com/%s/actions/runs/%s</link>\n' "${{ github.repository }}" "${{ github.run_id }}" >> "$FEED_FILE"
            printf '<description>%s</description>\n' "$DESC" >> "$FEED_FILE"
            printf '<pubDate>%s</pubDate>\n' "$PUB_DATE" >> "$FEED_FILE"
            printf '<guid>%s-%s</guid>\n' "${{ github.sha }}" "$GITHUB_RUN_ID" >> "$FEED_FILE"
            printf '</item>\n</channel>\n</rss>\n' >> "$FEED_FILE"
          fi

      - name: Save RSS History
        uses: actions/cache/save@v4
        if: always()
        with:
          path: public
          key: rss-storage-${{ github.ref_name }}-${{ github.run_id }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
